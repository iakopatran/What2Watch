<VirtualHost *:80>
    ServerName localhost

    Alias /php-api/ "/var/www/what2watch-api/"
    <Directory "/var/www/what2watch-api/">
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /php-api/ !
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
